
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relato Diário de Obra - Gênesis Azulejista</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #222;
  }
  label {
    font-weight: bold;
  }
  input, textarea, button {
    width: 100%;
    margin-top: 5px;
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
  button {
    background: #ffc107;
    border: none;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { background: #ffb300; }
  .relato {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
  }
  .data {
    font-weight: bold;
  }
  .acoes {
    text-align: right;
    margin-top: 5px;
  }
  .acoes button {
    background: #eee;
    color: #000;
    margin-left: 5px;
  }
  @media print {
    .no-print { display: none; }
    body { background: white; }
    .container { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Relato Diário de Obra - Gênesis Azulejista</h1>

  <div class="no-print">
    <label>Nome da Obra ou Cliente:</label>
    <input id="obra" placeholder="Ex: Obra da Sra. Paula - Banheiro">

    <label>Data do Dia:</label>
    <input type="date" id="data">

    <label>O que foi feito nesse dia:</label>
    <textarea id="descricao" rows="3" placeholder="Ex: Assentado porcelanato 12m² na cozinha"></textarea>

    <button id="salvar">Salvar Relato</button>
    <button id="imprimir">Imprimir Relatório</button>
  </div>

  <h2>Relatos Salvos</h2>
  <div id="lista"></div>
</div>

<script>
const LS_KEY = "relatos_obra_genesis";

function carregar() {
  const dados = localStorage.getItem(LS_KEY);
  return dados ? JSON.parse(dados) : [];
}

function salvar(dados) {
  localStorage.setItem(LS_KEY, JSON.stringify(dados));
}

function renderizar() {
  const lista = document.getElementById("lista");
  const dados = carregar().sort((a, b) => new Date(b.data) - new Date(a.data));
  lista.innerHTML = "";

  dados.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "relato";
    div.innerHTML = `
      <div class="data">${item.data} — <b>${item.obra}</b></div>
      <div>${item.descricao}</div>
      <div class="acoes no-print">
        <button onclick="editar(${i})">Editar</button>
        <button onclick="excluir(${i})">Excluir</button>
      </div>
    `;
    lista.appendChild(div);
  });
}

function editar(i) {
  const dados = carregar();
  const item = dados[i];
  document.getElementById("obra").value = item.obra;
  document.getElementById("data").value = item.data;
  document.getElementById("descricao").value = item.descricao;
  excluir(i);
}

function excluir(i) {
  const dados = carregar();
  if (confirm("Excluir este relato?")) {
    dados.splice(i, 1);
    salvar(dados);
    renderizar();
  }
}

document.getElementById("salvar").addEventListener("click", () => {
  const obra = document.getElementById("obra").value.trim();
  const data = document.getElementById("data").value;
  const descricao = document.getElementById("descricao").value.trim();

  if (!data || !descricao) {
    alert("Preencha a data e o que foi feito!");
    return;
  }

  const dados = carregar();
  dados.push({ obra, data, descricao });
  salvar(dados);

  document.getElementById("data").value = "";
  document.getElementById("descricao").value = "";

  renderizar();
});

document.getElementById("imprimir").addEventListener("click", () => {
  const dados = carregar().sort((a, b) => new Date(a.data) - new Date(b.data));
  let html = `<h2>Relato Diário de Obra - Gênesis Azulejista</h2>`;
  dados.forEach(item => {
    html += `<p><b>${item.data}</b> — ${item.obra || ""}<br>${item.descricao}</p>`;
  });
  const w = window.open("", "_blank");
  w.document.write(`<html><head><title>Relatório</title><meta charset='utf-8'></head><body>${html}</body></html>`);
  w.document.close();
  w.print();
});

renderizar();
</script>
</body>
</html>
